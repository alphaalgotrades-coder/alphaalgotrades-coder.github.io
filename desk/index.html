<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Desk · AlphaAlgoTrader</title>
<meta name="description" content="Today's economic releases, rates and the running stories — from primary sources, with the age of every reading shown.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================================
   THE DESK — a broadcast stage, not a web page.
   The narrator speaks OVER this, so: oversized type as structure, one idea
   dominant at a time, and motion that tells you something changed.
   Geometry is a fixed 16:9 STAGE scaled to the viewport, so the same markup
   is a readable page on a phone and a 1920x1080 backdrop for the encoder.
   Title-safe: nothing that must be read sits within 5% of any edge.
   ========================================================================= */
:root{
  --bg:#080a0e; --panel:#0f1218; --line:#1d222b; --ink:#f7f8fa;
  --dim:#a8adb8; --mut:#6b7280; --gold:#f0be46; --hot:#e2604f; --cool:#31c08a;
  --stage-w:1920; --stage-h:1080;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden;
  font-family:"Inter",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  color:var(--ink);-webkit-font-smoothing:antialiased}
.display{font-family:"Barlow Condensed","Inter",sans-serif;font-weight:700;
  letter-spacing:.005em}
.label{font-size:15px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;
  color:var(--gold)}
.mutlabel{font-size:13px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;
  color:var(--mut)}
.num{font-variant-numeric:tabular-nums lining-nums}
.up{color:var(--cool)} .dn{color:var(--hot)}

/* the stage: fixed pixel geometry, scaled to fit whatever it is shown on */
#stage{position:absolute;top:50%;left:50%;width:1920px;height:1080px;
  transform-origin:center center;
  background:
    radial-gradient(1200px 700px at 78% 8%, rgba(46,86,110,.30), transparent 62%),
    radial-gradient(900px 620px at 4% 96%, rgba(240,190,70,.07), transparent 60%),
    var(--bg);
  display:grid;grid-template-rows:186px 1fr 92px;
  grid-template-columns:1fr;overflow:hidden}

/* ---------------------------------------------------------------- masthead */
header{display:flex;align-items:flex-start;justify-content:space-between;
  padding:52px 76px 0}
.brandmark{display:flex;align-items:center;gap:14px}
.dot{width:13px;height:13px;border-radius:50%;background:var(--gold)}
.brandmark span{font-size:16px;font-weight:700;letter-spacing:.26em;
  text-transform:uppercase;color:var(--dim)}
h1{font-size:76px;line-height:.88;letter-spacing:.012em;text-transform:uppercase;
  margin-top:8px}
h1 em{font-style:normal;color:var(--gold)}
.datestamp{margin-top:10px;font-size:17px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--mut);font-weight:600}
.right{display:flex;align-items:center;gap:44px}
.clock b{display:block;font-size:12px;letter-spacing:.24em;color:var(--mut);
  text-transform:uppercase;margin-bottom:3px}
.clock span{font-size:40px;line-height:1;font-weight:600}
.onair{display:flex;align-items:center;gap:11px;border:1px solid var(--line);
  border-radius:999px;padding:10px 20px;background:rgba(226,96,79,.07)}
.pulse{width:11px;height:11px;border-radius:50%;background:var(--hot);
  animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.78)}}
.onair b{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}

/* ------------------------------------------------------------------- body */
main{display:grid;grid-template-columns:660px 1fr;gap:52px;padding:34px 76px 0;
  min-height:0;transition:padding-top .5s cubic-bezier(.2,.8,.2,1)}
#stage.alert main{padding-top:104px}

/* the tape — the running order, left, always visible */
.tape{display:flex;flex-direction:column;min-height:0}
.tape .head{padding-bottom:12px;border-bottom:2px solid var(--gold)}
.tape .head .mutlabel{display:block;margin-top:5px;font-size:12px;letter-spacing:.14em}
.tape ol{list-style:none;overflow:hidden;margin-top:6px;flex:1;
  display:flex;flex-direction:column}
.tape li{flex:1;min-height:0;display:grid;
  grid-template-columns:20px 86px 1fr auto;gap:16px;align-content:center;
  align-items:baseline;padding:4px 0;border-bottom:1px solid var(--line);
  animation:rise .45s ease both}
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.imp{width:9px;height:9px;border-radius:50%;background:var(--line);align-self:center}
.imp.high{background:var(--hot);box-shadow:0 0 0 4px rgba(226,96,79,.16)}
.imp.medi{background:var(--gold)}
.beat{color:var(--cool)} .miss{color:var(--hot)}
.tape .v small{display:block;font-size:13px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;text-align:right;margin-top:2px}
.pager{display:flex;align-items:center;gap:8px;padding-top:14px;margin-top:auto}
.pager i{width:26px;height:3px;border-radius:2px;background:var(--line);transition:background .3s}
.pager i.on{background:var(--gold)}
.pager em{font-style:normal;margin-left:auto;font-size:12px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--mut);font-weight:600}
.tape .t{font-size:22px;font-weight:600;color:var(--gold);letter-spacing:.02em}
.tape .n{font-size:22px;color:var(--ink);line-height:1.22}
.tape .n i{display:block;font-style:normal;font-size:15px;color:var(--mut);
  margin-top:3px;letter-spacing:.04em}
.tape .v{font-size:30px;font-weight:700;letter-spacing:.01em}
.tape li.done .n{color:var(--dim)}
.tape li.next{background:linear-gradient(90deg,rgba(240,190,70,.10),transparent 74%);
  box-shadow:inset 3px 0 0 var(--gold)}
.tape li.next .n{color:#fff}

/* the hero — ONE idea at a time, because she is talking about one thing */
.hero{position:relative;display:flex;flex-direction:column;min-height:0;
  background:linear-gradient(160deg,var(--panel),rgba(15,18,24,.35));
  border:1px solid var(--line);border-radius:18px;padding:36px 40px 30px;
  overflow:hidden}
.hero .head{flex:0 0 auto;display:flex;align-items:baseline;
  justify-content:space-between;margin-bottom:18px}
#slides{position:relative;flex:1;min-height:0}
.counter{font-size:14px;letter-spacing:.2em;color:var(--mut);font-weight:600}
.slide{position:absolute;inset:0;opacity:0;transform:translateY(16px);
  transition:opacity .45s ease,transform .45s ease;pointer-events:none;
  display:flex;flex-direction:column;justify-content:center}
.slide.on{opacity:1;transform:none}

/* rates board */
.rates{display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:1fr 1fr;
  gap:26px;flex:1}
.rate{position:relative;overflow:hidden;background:rgba(255,255,255,.022);
  border:1px solid var(--line);border-radius:16px;padding:26px 30px 0;
  display:flex;flex-direction:column;justify-content:flex-start}
.rate .spark{position:absolute;left:0;right:0;bottom:0;height:44%;opacity:.95}
.rate .row{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.rate b{display:block;font-size:15px;letter-spacing:.2em;color:var(--mut);
  text-transform:uppercase;margin-bottom:6px}
.rate .lv{font-size:66px;line-height:1;font-weight:700;letter-spacing:-.012em}
.rate .mv{font-size:22px;font-weight:600}
.rate .rd{font-size:13px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--mut);margin-top:9px}

/* a story: the headline IS the picture */
.story .src{align-self:flex-start;display:inline-block;font-size:13px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--bg);background:var(--gold);
  padding:5px 12px;border-radius:4px;font-weight:700;margin-bottom:22px}
.story h3{font-size:58px;line-height:1.06;font-weight:700;letter-spacing:.004em}
.story .topic{margin-top:22px;font-size:17px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--mut);font-weight:600}

/* a single big number, when that is the whole point */
.figure .kick{font-size:19px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--gold);font-weight:600}
.figure .big{font-size:150px;line-height:.92;font-weight:700;margin:14px 0 6px;
  letter-spacing:-.02em}
.figure .sub{font-size:25px;color:var(--dim);line-height:1.34;max-width:22ch}


/* ---- BREAKING. Exists only when something has just printed, so the clean
   state stays clean. Slides under the masthead, holds ~50s, retracts. */
.breaking{position:absolute;left:0;right:0;top:186px;z-index:9;
  display:flex;align-items:center;gap:22px;padding:16px 76px;
  background:linear-gradient(90deg,rgba(226,96,79,.22),rgba(226,96,79,.04) 62%,transparent);
  border-top:1px solid rgba(226,96,79,.4);border-bottom:1px solid rgba(226,96,79,.4);
  transform:translateY(calc(-100% - 190px));
  transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.breaking.on{transform:none}
.breaking .tagb{background:var(--hot);color:#0a0c10;font-size:14px;font-weight:700;
  letter-spacing:.22em;text-transform:uppercase;padding:7px 15px;border-radius:4px;
  animation:blink 1.4s steps(1,end) infinite}
@keyframes blink{0%,60%{opacity:1}61%,100%{opacity:.45}}
.breaking .txt{font-size:26px;font-weight:600}
@keyframes flash{0%,100%{background:transparent}
  18%{background:rgba(226,96,79,.26)}60%{background:rgba(226,96,79,.08)}}
.tape li.flash{animation:flash 2.6s ease 2}

/* the thing nobody else is covering */
.radar{display:inline-block;margin-left:10px;font-size:11px;font-weight:700;
  letter-spacing:.16em;text-transform:uppercase;color:var(--gold);
  border:1px solid rgba(240,190,70,.42);border-radius:3px;padding:2px 7px;
  vertical-align:middle}

/* world + auctions */
.world{display:flex;flex-direction:column;flex:1;justify-content:center}
.world .wr{display:grid;grid-template-columns:1.25fr repeat(3,1fr);gap:14px;
  align-items:baseline;padding:16px 4px;border-bottom:1px solid var(--line)}
.world .wr.hd{border-bottom:2px solid var(--gold);padding-bottom:10px}
.world .wr.hd span{font-size:13px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--mut);font-weight:600}
.world .cty{font-size:25px;font-weight:600}
.world .cty i{font-style:normal;color:var(--mut);font-size:15px;margin-left:8px;
  letter-spacing:.14em}
.world .val{font-size:34px;font-weight:700}
.world .val u{display:block;text-decoration:none;font-size:11px;color:var(--mut);
  letter-spacing:.14em;font-weight:600;margin-top:2px}
.auc{display:flex;flex-direction:column;flex:1;justify-content:center}
.auc .ar{display:grid;grid-template-columns:120px 1fr auto;gap:18px;
  align-items:baseline;padding:13px 2px;border-bottom:1px solid var(--line)}
.auc .ad{font-size:19px;color:var(--gold);font-weight:600}
.auc .at{font-size:23px}
.auc .aa{font-size:30px;font-weight:700}
.auc .tot{margin-top:18px;font-size:19px;color:var(--dim)}
.auc .tot b{color:var(--ink);font-size:30px;font-weight:700}

/* ----------------------------------------------------------------- ticker */
footer{display:flex;align-items:center;gap:0;border-top:1px solid var(--line);
  background:rgba(0,0,0,.42);overflow:hidden}
.tag{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:0 30px;
  height:100%;background:var(--gold);color:#0a0c10}
.tag b{font-size:16px;letter-spacing:.2em;text-transform:uppercase;font-weight:700}
.rail{flex:1;overflow:hidden;white-space:nowrap;position:relative;height:100%;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 96px,#000 calc(100% - 96px),transparent);
  mask-image:linear-gradient(90deg,transparent,#000 96px,#000 calc(100% - 96px),transparent)}
.run{position:absolute;top:50%;transform:translateY(-50%);display:flex;
  align-items:center;gap:72px;animation:run 58s linear infinite;padding-left:72px}
@keyframes run{from{transform:translate(0,-50%)}to{transform:translate(-50%,-50%)}}
.q{display:flex;align-items:baseline;gap:12px}
.q b{font-size:16px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);
  font-weight:600}
.q .p{font-size:25px;font-weight:600}
.q .c{font-size:19px;font-weight:600}
.stamp{flex:0 0 auto;max-width:430px;padding:0 30px;font-size:13px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--mut);border-left:1px solid var(--line);
  display:flex;align-items:center;height:100%}

/* ---- "Listen live" (NEXT_UP 0a, 2026-09-21). The page on its own is silent; the
   YouTube broadcast carries the voiced bulletins and music. ⛔ THIS PAGE IS WHAT
   THE BROADCAST FILMS (deskstream.DESK_URL), so the button starts HIDDEN and is
   only revealed for a real visitor: never under an automated browser
   (navigator.webdriver) and never with ?stage in the URL. If the reveal code
   fails, the button stays hidden, which is the safe way to fail.
   ⛔ Embed the CHANNEL's live address, never a video id (a new id every day). */
#golive{display:none;position:fixed;right:16px;bottom:16px;z-index:50;
  align-items:center;gap:9px;padding:10px 16px;border:0;border-radius:999px;
  background:var(--gold);color:#0a0c10;font:600 14px/1 "Inter",system-ui,sans-serif;
  letter-spacing:.02em;cursor:pointer;box-shadow:0 6px 24px rgba(0,0,0,.45)}
#golive.on{display:flex}
#golive i{width:9px;height:9px;border-radius:50%;background:var(--hot)}
#liveov{display:none;position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.82);
  align-items:center;justify-content:center;padding:16px}
#liveov.on{display:flex}
#liveov .box{position:relative;width:min(1100px,100%);}
#liveov .vid{position:relative;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden}
#liveov iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#liveov .x{position:absolute;right:0;top:-44px;width:36px;height:36px;border:0;
  border-radius:50%;background:#ffffff22;color:#fff;font:600 20px/1 system-ui;cursor:pointer}
#liveov p{color:var(--dim);font:14px/1.5 "Inter",system-ui,sans-serif;margin-top:10px}
#liveov p a{color:var(--gold);text-decoration:none;font-weight:600}
/* ---- SITE NAV for real visitors (2026-09-21). The desk was a dead end: its only
   link was "open on YouTube", so a visitor who arrived from the stream could not
   reach the book, the lessons or the trial -- the same fault the book page had
   on 08-30 ("a nav that is only reachable by scrolling is not navigation").
   Revealed by the SAME gate as #golive, so the broadcast never films it. */
#sitenav{display:none;position:fixed;left:16px;bottom:16px;z-index:50;gap:8px}
#sitenav.on{display:flex}
#sitenav a{padding:10px 14px;border-radius:999px;background:#ffffff14;color:var(--ink);
  font:600 14px/1 "Inter",system-ui,sans-serif;text-decoration:none;letter-spacing:.02em}
#sitenav a.cta{background:var(--cool);color:#0a0c10}
</style></head>
<body>
<div id="stage">
  <header>
    <div>
      <div class="brandmark"><i class="dot"></i><span>AlphaAlgoTrader</span></div>
      <h1 class="display">The <em>Desk</em></h1>
      <div class="datestamp" id="datestamp">—</div>
    </div>
    <div class="right">
      <div class="clock"><b>New York</b><span class="num display" id="ny">--:--:--</span></div>
      <div class="clock"><b>London</b><span class="num display" id="ld">--:--:--</span></div>
      <div class="onair"><i class="pulse"></i><b id="onair">Updating</b></div>
    </div>
  </header>

  <div class="breaking" id="breaking"><span class="tagb">Breaking</span>
    <span class="txt" id="breaking-txt"></span></div>

  <main>
    <section class="tape">
      <div class="head"><h2 class="label">On the tape today</h2>
        <span class="mutlabel" id="tape-note">Eastern time</span></div>
      <ol id="tape"></ol>
      <div class="pager" id="pager"></div>
    </section>

    <section class="hero">
      <div class="head"><h2 class="label" id="hero-label">—</h2>
        <span class="counter" id="hero-count">01 / 01</span></div>
      <div id="slides"></div>
    </section>
  </main>

  <footer>
    <div class="tag"><b id="tag">Markets</b></div>
    <div class="rail"><div class="run" id="run"></div></div>
  </footer>
</div>

<script>
/* ---- the stage scales to whatever it is shown on: phone, monitor, encoder */
function fit(){
  const s=document.getElementById('stage');
  /* ⛔ a HIDDEN or not-yet-laid-out tab reports innerWidth 0, and scale(0)
     renders the whole stage invisible with every element measuring 0x0.
     Found 18 Sep when the geometry check came back all zeroes. Clamp, and
     re-fit when the page actually becomes visible. */
  const w=innerWidth||document.documentElement.clientWidth||1920;
  const h=innerHeight||document.documentElement.clientHeight||1080;
  const k=Math.max(0.05, Math.min(w/1920, h/1080));
  s.style.transform=`translate(-50%,-50%) scale(${k})`;
}
addEventListener('resize',fit);
addEventListener('load',fit);
document.addEventListener('visibilitychange',fit);
fit();

const pad=n=>String(n).padStart(2,'0');
const tz=z=>new Date().toLocaleTimeString('en-GB',{timeZone:z,hour12:false});
function clocks(){ny.textContent=tz('America/New_York');ld.textContent=tz('Europe/London');}
clocks(); setInterval(clocks,1000);

const sign=v=>v==null?'':(v>0?'+':'')+v.toFixed(2);
const cls =v=>v==null?'':(v>0?'up':(v<0?'dn':''));
function ago(iso){if(!iso)return '—';const m=(Date.now()-new Date(iso).getTime())/6e4;
 if(m<1)return 'just now'; if(m<90)return Math.round(m)+' min ago';
 return Math.round(m/60)+' h ago';}
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));


/* ---- reading a release: did it beat or miss, and does that help the currency?
   ⛔ "Beat" is not always "good". Higher jobless claims is a WORSE number, so
   the sign is inverted for those. Where we cannot tell, nothing is coloured --
   an honest blank beats a confident wrong colour. */
/* SLACK AND DISTRESS: a higher print means a LOOSER central bank, so it is
   currency-NEGATIVE and the sign flips. Audited against the 274 release titles
   we actually carry -- `delinquenc` and `job cut` were live gaps (Mortgage
   Delinquencies, Challenger Job Cuts y/y); the rest are guards for titles that
   have not appeared yet. Balances are NOT here: ours arrive signed, so a
   higher number is already a smaller deficit. */
const INVERSE=/claims|unemployment rate|jobless|deficit|job cut|layoff|delinquenc|foreclos|bankrupt|insolvenc|redundan/i;
/* GENUINELY TWO-SIDED: a build can be failed demand or deliberate restocking,
   and economists do not give it one sign. Colouring it either way would be a
   confident guess, so it gets none. */
const AMBIGUOUS=/inventor|stockpile/i;
function num(s){
  if(s==null)return null;
  const str=String(s).trim();
  const m=str.replace(/[,%$]/g,'').match(/-?\d+(\.\d+)?/);
  if(!m)return null;
  let v=parseFloat(m[0]);
  if(/k\b/i.test(str))v*=1e3; else if(/m\b/i.test(str))v*=1e6;
  else if(/b\b/i.test(str))v*=1e9; else if(/t\b/i.test(str))v*=1e12;
  return v;
}
function verdict(r){
  const a=num(r.actual), c=num(r.cons);
  if(a==null||c==null)return 0;
  if(AMBIGUOUS.test(r.title))return 0;      /* an honest blank, on purpose */
  if(Math.abs(a-c)<1e-9)return 0;
  const better = INVERSE.test(r.title) ? (a<c) : (a>c);
  return better?1:-1;
}

/* ---- how far off consensus, and is anyone covering it? --------------------
   THE DIFFERENTIATOR, MADE MECHANICAL. Everyone covers a HIGH-impact release.
   A LOW-impact one that missed badly is exactly the thing being drowned out --
   which is this desk's whole editorial line. Big surprise + low billing =
   UNDER THE RADAR, and the page says so. */
function surprise(r){
  const a=num(r.actual), c=num(r.cons);
  if(a==null||c==null)return 0;
  return Math.abs(a-c)/Math.max(Math.abs(c),0.15);
}
function underRadar(r){
  const imp=(r.impact||'').toLowerCase();
  return !!r.actual && surprise(r)>=0.5 && !imp.startsWith('high');
}

/* ---- BREAKING: a number that was not there last time we looked ---------- */
let SEEN=null, breakTimer=null, JUST=null;
function breaking(rows){
  const now=new Set(rows.filter(r=>r.actual).map(r=>r.time+'|'+r.title));
  if(SEEN===null){ SEEN=now; return []; }        /* first paint is not news */
  const fresh=rows.filter(r=>r.actual && !SEEN.has(r.time+'|'+r.title));
  SEEN=now; return fresh;
}
let RATED=null;
function breakingRatings(rows){
  /* by ID: the agency serves an action for days, so matching on the headline
     would relight the bar on every refresh, forever. */
  const now=new Set((rows||[]).map(function(r){return String(r.id);}));
  if(RATED===null){ RATED=now; return []; }      /* first paint is not news */
  const fresh=(rows||[]).filter(function(r){ return !RATED.has(String(r.id)); });
  RATED=now; return fresh;
}
function announceRating(r){
  const el=document.getElementById('breaking');
  document.getElementById('breaking-txt').innerHTML =
    '<b>'+esc(r.title)+'</b>';
  el.classList.add('on');
  document.getElementById('stage').classList.add('alert');
  clearTimeout(breakTimer);
  breakTimer=setTimeout(function(){ el.classList.remove('on');
    document.getElementById('stage').classList.remove('alert'); }, 50000);
}
function announce(r){
  const el=document.getElementById('breaking');
  const v=verdict(r), word=v>0?'above':(v<0?'below':'in line with');
  document.getElementById('breaking-txt').innerHTML =
    '<b>'+esc(r.title)+'</b> '+esc(r.actual)+' \u00b7 '+word+' consensus'
    +(r.cons?(' of '+esc(r.cons)):'');
  el.classList.add('on');
  document.getElementById('stage').classList.add('alert');
  clearTimeout(breakTimer);
  breakTimer=setTimeout(function(){ el.classList.remove('on');
    document.getElementById('stage').classList.remove('alert'); }, 50000);
  /* and put it on the big screen -- it is what she will talk about next */
  JUST=r;
  SLIDES=buildSlides(window.__desk);
  document.getElementById('slides').innerHTML=SLIDES.map(function(s){return s.html;}).join('');
  desk.cue(0);
  setTimeout(function(){ desk.auto(9000); }, 30000);
}

const PER=7;
let TAPE=[], NEXT=-1, page=0, PAGES=1, pageTimer=null, FLASH=new Set();

function drawTape(nowET){
  const slice=TAPE.slice(page*PER,(page+1)*PER);
  document.getElementById('tape').innerHTML = slice.map((r)=>{
    const i=TAPE.indexOf(r);
    const has=!!r.actual, past=r.time<=nowET;
    let cl=past?'done':''; if(i===NEXT)cl='next';
    const v=has?verdict(r):0;
    const vc=v>0?'beat':(v<0?'miss':'');
    const tag=v>0?'above cons.':(v<0?'below cons.':'');
    const imp=(r.impact||'').toLowerCase().startsWith('high')?'high'
             :(r.impact||'').toLowerCase().startsWith('med')?'medi':'';
    if(FLASH.has(r.time+'|'+r.title)) cl+=' flash';
    const radar=underRadar(r)?'<span class="radar">under the radar</span>':'';
    return `<li class="${cl}"><i class="imp ${imp}"></i>
      <span class="t num">${esc(r.time)}</span>
      <span class="n">${esc(r.title)}${radar}<i>${esc(r.ccy)}${r.cons?' · cons. '+esc(r.cons):''}${r.prev?' · prev. '+esc(r.prev):''}</i></span>
      <span class="v num ${vc}">${has?esc(r.actual):''}${tag?`<small>${tag}</small>`:''}</span></li>`;
  }).join('') || '<li><span class="n">Nothing scheduled today.</span></li>';
  document.getElementById('pager').innerHTML =
    Array.from({length:PAGES},(_,k)=>`<i class="${k===page?'on':''}"></i>`).join('')
    + `<em>${TAPE.filter(r=>r.actual).length} of ${TAPE.length} in</em>`;
}

let SLIDES=[], at=0, timer=null;

/* ---- the day's path, drawn. The level says where it is; the line says how it
   got there, and the table already stores every 5-minute reading. */
function spark(pts, dayBps){
  if(!pts || pts.length < 3) return '';
  const w=420, h=86, lo=Math.min(...pts), hi=Math.max(...pts), span=(hi-lo)||1e-6;
  const x=i=>(i/(pts.length-1))*w;
  const y=v=>h-4-((v-lo)/span)*(h-14);
  const line=pts.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const area=`${line} L${w},${h} L0,${h} Z`;
  const c=dayBps>0?'var(--cool)':(dayBps<0?'var(--hot)':'var(--mut)');
  const id='g'+Math.random().toString(36).slice(2,8);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${c}" stop-opacity=".26"/>
      <stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#${id})"/>
    <path d="${line}" fill="none" stroke="${c}" stroke-width="2.4"
      stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  </svg>`;
}

function buildSlides(d){
  const out=[];
  if(JUST){
    const v=verdict(JUST), c=v>0?'beat':(v<0?'miss':'');
    out.push({label:'Just printed', html:'<div class="slide figure">'
      +'<div class="kick">'+esc(JUST.time)+' Eastern \u00b7 '+esc(JUST.ccy)+'</div>'
      +'<div class="big num display '+c+'">'+esc(JUST.actual)+'</div>'
      +'<div class="sub">'+esc(JUST.title)
      +(JUST.cons?('<br><span style="color:var(--mut);font-size:19px">consensus '+esc(JUST.cons)
        +(JUST.prev?(' \u00b7 previous '+esc(JUST.prev)):'')+'</span>'):'')
      +'</div></div>'});
  }
  if(d.rates.rows.length){
    out.push({label:'Rates', html:`<div class="slide">
      <div class="rates">${d.rates.rows.map(r=>`<div class="rate">
        <b>${esc(r.series)} Treasury</b>
        <div class="row"><span class="lv num display">${r.level==null?'—':r.level.toFixed(3)+'%'}</span>
          <span class="mv num ${cls(r.d_day_bps)}">${r.d_day_bps==null?'':sign(r.d_day_bps)+' bp today'}</span></div>
        <div class="rd">${esc(r.lean||'')} · today</div>
        ${spark(r.spark, r.d_day_bps)}</div>`).join('')}</div></div>`});
  }
  if((d.world||[]).length){
    const cell=function(o){ return (o&&o.v) ? (esc(o.v)+'<u>'+String(o.date||'').slice(5)+'</u>')
      : '<span style="color:var(--mut)">\u2014</span>'; };
    out.push({label:'The world', html:'<div class="slide world">'
      +'<div class="wr hd"><span></span><span>Policy rate</span><span>Inflation</span><span>Unemployment</span></div>'
      +d.world.map(function(w){
        const c=w.cells||{}, inf=c['Inflation'], un=c['Unemployment'];
        return '<div class="wr"><span class="cty">'+esc(w.name)+'<i>'+esc(w.ccy)+'</i></span>'
          +'<span class="val num">'+(w.policy==null?'\u2014':w.policy.toFixed(2)+'%')
            +'<u>'+String(w.policy_since||'').slice(5)+'</u></span>'
          +'<span class="val num">'+cell(inf)+'</span>'
          +'<span class="val num">'+cell(un)+'</span></div>'; }).join('')
      +'</div>'});
  }
  const eu=(d.europe||{}).rows||[];
  if(eu.length){
    out.push({label:'Europe pays', html:'<div class="slide world">'
      +'<div class="wr hd"><span></span><span>10-year</span><span>On the day</span><span>Over Germany</span></div>'
      +eu.map(function(r){
        const hot = r.spread_bp!=null && r.spread_bp>=100;
        return '<div class="wr"><span class="cty">'+esc(r.name)+'<i>10Y</i></span>'
          +'<span class="val num">'+(r.level==null?'\u2014':r.level.toFixed(3)+'%')+'</span>'
          +'<span class="val num '+cls(r.d_day_bps)+'">'
            +(r.d_day_bps==null?'\u2014':sign(r.d_day_bps)+' bp')+'</span>'
          +'<span class="val num'+(hot?' miss':'')+'">'
            +(r.spread_bp==null?'\u2014':r.spread_bp.toFixed(0)+' bp')+'</span></div>'; }).join('')
      +'<div class="tot" style="font-size:19px">Germany is the risk-free leg \u00b7 '
      +'the gap is what the market charges for the country</div>'
      +'</div>'});
  }
  const rt=d.ratings||[];
  if(rt.length){
    out.push({label:'Rating actions', html:'<div class="slide auc">'
      +rt.map(function(r){
        const down = r.action==='downgrade';
        return '<div class="ar"><span class="ad num">'+esc(String(r.date||'').slice(5))+'</span>'
          +'<span class="at">'+esc(r.title)+'</span>'
          +'<span class="aa num '+(down?'miss':'beat')+'">'
            +(down?'DOWNGRADE':'UPGRADE')+'</span></div>'; }).join('')
      +'<div class="tot" style="font-size:19px">'+esc(rt[0].agency||'')
      +' \u00b7 sovereign actions only</div>'
      +'</div>'});
  }
  const au=d.auctions||{};
  if((au.rows||[]).length){
    out.push({label:'What the Treasury sells next', html:'<div class="slide auc">'
      +au.rows.map(function(a){
        return '<div class="ar"><span class="ad num">'+esc(a.date.slice(5))+'</span>'
          +'<span class="at">'+esc(a.type)+' \u00b7 '+esc(a.term)+'</span>'
          +'<span class="aa num">'+(a.amount_bn==null?'\u2014':'$'+a.amount_bn+'bn')+'</span></div>'; }).join('')
      +(au.total_bn?('<div class="tot">Announced so far: <b>$'+au.total_bn+'bn</b></div>'):'')
      +'</div>'});
  }
  /* THE BOOK (Julio 2026-09-21: "yes add it"). Read from the public
     book.json via data.json -- dollars only. No percentage of any kind is
     drawn here: the capture rule keeps any return figure out of frame, and
     livedesk._book() never copies the stats block in the first place.
     Realised AND open are shown together; one without the other flatters. */
  const bk=d.book;
  if(bk && bk.realized!=null){
    const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const md=function(iso){ const p=String(iso||'').split('-');
      return p.length===3 ? MON[parseInt(p[1],10)-1]+' '+parseInt(p[2],10) : ''; };
    const usd=function(v){ return (v<0?'−':'+')+'$'
      +Math.abs(v).toLocaleString('en-US',{maximumFractionDigits:0}); };
    const px=function(v){ return '$'+Number(v).toFixed(2); };
    out.push({label:'The book', html:'<div class="slide figure">'
      +'<div class="kick">The wheel · since '+esc(md(bk.since))+' · '
        +esc(String(bk.trading_days))+' trading days</div>'
      +'<div class="big num display '+(bk.realized>=0?'beat':'miss')+'">'+usd(bk.realized)+'</div>'
      +'<div class="sub" style="max-width:30ch">banked since '+esc(md(bk.since))
      +(bk.open_upnl!=null?('<br>open positions <b class="num '+(bk.open_upnl>=0?'beat':'miss')+'">'
        +usd(bk.open_upnl)+'</b> not yet closed'):'')
      +'<br><span style="color:var(--mut);font-size:19px">'
        +esc(String(bk.green_days))+' green days · '+esc(String(bk.red_days))+' red · '
        +esc(String(bk.total_fills))+' trades'
        +(bk.as_of_et?(' · updated '+esc(bk.as_of_et)+' ET'):'')+'</span>'
      +'</div></div>'});
    const rows=(bk.legs||[]).map(function(l){
        return '<div class="ar"><span class="ad num">'+esc(md(l.expiry))+'</span>'
          +'<span class="at">'+esc(l.symbol)+' '+px(l.strike)+' '+esc(l.right)
          +' · '+(l.sold?'sold ':'bought ')+esc(String(l.qty||''))+'</span>'
          +'<span class="aa num">'+px(l.entry)+'</span></div>'; })
      .concat((bk.held||[]).map(function(h){
        return '<div class="ar"><span class="ad num">shares</span>'
          +'<span class="at">'+esc(h.symbol)+' · '+esc(String(h.shares))+' shares</span>'
          +'<span class="aa num">'+px(h.basis)+'</span></div>'; }));
    if(rows.length){
      out.push({label:'The book, open positions', html:'<div class="slide auc">'
        +rows.slice(0,8).join('')
        +'<div class="tot" style="font-size:19px">options: expiry · premium per share'
        +' · shares: cost after premiums</div></div>'});
    }
  }
  (d.stories||[]).slice(0,4).forEach(s=>{
    out.push({label:'Running story', html:`<div class="slide story">
      <span class="src">${esc(s.source||'wire')}</span>
      <h3 class="display">${esc(String(s.title||'').replace(/\s+[-–—]\s+[^-–—]{2,40}$/,''))}</h3>
      <div class="topic">${esc(s.topic)}</div></div>`});
  });
  const nxt=(d.tape||[]).find(r=>!r.actual && r.time);
  if(nxt){
    out.push({label:'Next on the tape', html:`<div class="slide figure">
      <div class="kick">${esc(nxt.time)} Eastern · ${esc(nxt.ccy)}</div>
      <div class="big num display">${esc(nxt.cons||'—')}</div>
      <div class="sub">${esc(nxt.title)}${nxt.prev?` · previous ${esc(nxt.prev)}`:''}
        <br><span style="color:var(--mut);font-size:19px">consensus, not our forecast</span></div></div>`});
  }
  return out.length?out:[{label:'The Desk',html:'<div class="slide figure"><div class="sub">Standing by.</div></div>'}];
}

function show(i){
  const els=document.querySelectorAll('#slides .slide');
  els.forEach(e=>e.classList.remove('on'));
  if(!els[i])return;
  els[i].classList.add('on');
  document.getElementById('hero-label').textContent=SLIDES[i].label;
  document.getElementById('hero-count').textContent=pad(i+1)+' / '+pad(SLIDES.length);
}
function rotate(){ at=(at+1)%SLIDES.length; show(at); }

const panel=(name,fn)=>{ try{ fn(); }catch(e){
  console.error('desk panel failed:', name, e);
  /* leave whatever was there -- a stale panel beats a black screen */ } };

/* Replaced with a hash of this file at write time. Left as the literal
   placeholder when the page is opened straight from the repo, which is the
   signal to skip the check entirely rather than reload in a loop. */
const BUILD='19669f8d6e';

function checkBuild(d){
  if(!d.build || BUILD.indexOf('BUILD')>=0) return;   /* unstamped: do nothing */
  if(d.build===BUILD){ try{ sessionStorage.removeItem('deskBuildTried'); }catch(e){}
    return; }
  let tried=null; try{ tried=sessionStorage.getItem('deskBuildTried'); }catch(e){}
  if(tried===d.build){
    /* we already reloaded once for this build and the server is still handing
       back the old file -- stop, and be honest on screen instead of looping */
    const el=document.getElementById('onair');
    if(el) el.textContent='Update pending';
    return;
  }
  try{ sessionStorage.setItem('deskBuildTried', d.build); }catch(e){}
  location.replace(location.pathname+'?v='+encodeURIComponent(d.build));
}

async function paint(){
  let d; try{ d=await (await fetch('data.json?t='+Date.now())).json(); }catch(e){ return; }
  window.__desk=d;
  checkBuild(d);

  panel('date', ()=>{ document.getElementById('datestamp').textContent =
    new Date(d.date_et+'T12:00:00').toLocaleDateString('en-GB',
      {weekday:'long',day:'numeric',month:'long',year:'numeric'}); });

  /* the tape: what has printed is dimmed and carries its actual; the next one
     to land is highlighted, because that is what she will talk about next */
  panel('tape', ()=>{
  const rows=(d.tape||[]).filter(r=>r.time);
  TAPE=rows;
  const fresh=breaking(rows);
  FLASH=new Set(fresh.map(function(r){return r.time+'|'+r.title;}));
  if(fresh.length){ page=Math.floor(rows.indexOf(fresh[0])/PER); announce(fresh[0]); }
  const nowET=new Date().toLocaleTimeString('en-GB',
    {timeZone:'America/New_York',hour12:false}).slice(0,5);
  NEXT=rows.findIndex(r=>r.time>nowET);
  /* open on the page that holds what is coming next, not on 02:00 */
  if(!fresh.length) page = NEXT>=0 ? Math.floor(NEXT/PER) : 0;
  PAGES = Math.max(1, Math.ceil(rows.length/PER));
  drawTape(nowET);
  clearInterval(pageTimer); pageTimer=setInterval(()=>{
    page=(page+1)%PAGES; drawTape(nowET);
  }, 8500);
  });

  /* a country being downgraded outranks a data surprise on the bar */
  panel('ratings', ()=>{
    const hot=breakingRatings(d.ratings||[]).filter(r=>r.action==='downgrade');
    if(hot.length) announceRating(hot[0]);
  });

  panel('hero', ()=>{
  SLIDES=buildSlides(d);
  document.getElementById('slides').innerHTML=SLIDES.map(s=>s.html).join('');
  if(at>=SLIDES.length) at=0;
  show(at);
  clearInterval(timer); timer=setInterval(rotate, 9000); });

  panel('ticker', ()=>{ document.getElementById('run').innerHTML=(()=>{
    const one=(d.strip.rows||[]).map(r=>`<span class="q"><b>${esc(r.name)}</b>
      <span class="p num">${r.price==null?'—':r.price.toLocaleString()}</span>
      <span class="c num ${cls(r.pct)}">${r.pct==null?'—':sign(r.pct)+'%'}</span></span>`).join('');
    return one+one;   /* doubled so the loop is seamless */
  })(); });

  panel('stamps', ()=>{
  document.getElementById('onair').textContent =
    'Updated '+ago(d.generated_utc)+' · snapshot';
  document.getElementById('tape-note').textContent =
    'Eastern time · cons. and prev. from our calendar'; });
}
paint(); setInterval(paint, 60000);

/* ⭐ window.desk — the cue API. The narration and the screen come from ONE
   script: every spoken line carries the cue it belongs to, and whatever is
   playing the audio calls desk.cue() on the word it starts. Used by the
   recorded render (Playwright steps it frame-accurately from Kokoro's word
   timings) and by a live operator (OBS browser source + the same cue list). */
window.desk = {
  cue(name){                       /* 'rates' | 'story:2' | 'next' | index */
    if(typeof name === 'number'){ clearInterval(timer); at=name%SLIDES.length; show(at); return at; }
    const want = String(name||'').toLowerCase();
    let i = SLIDES.findIndex(s => s.label.toLowerCase().startsWith(want.split(':')[0]));
    if(want.startsWith('story:')) i = i + (parseInt(want.split(':')[1]||'1',10) - 1);
    if(i < 0 || i >= SLIDES.length) return -1;
    clearInterval(timer); at=i; show(at); return at;
  },
  hold(){ clearInterval(timer); },
  auto(ms){ clearInterval(timer); timer=setInterval(rotate, ms||9000); },
  slides(){ return SLIDES.map(s=>s.label); },
  data(){ return window.__desk; },
  ready(){ return SLIDES.length > 0; }
};

/* the narrator drives the hero by hand when this is a broadcast:
   ← → step, space holds. Auto-rotation resumes on the next data refresh. */
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'){clearInterval(timer);rotate();}
  if(e.key==='ArrowLeft'){clearInterval(timer);at=(at-1+SLIDES.length)%SLIDES.length;show(at);}
  if(e.key===' '){e.preventDefault();clearInterval(timer);}
});
